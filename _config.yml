theme: jekyll-theme-chirpy

# Language code; ko-KR matches the Korean locale shipped with the theme
# (_data/locales/ko-KR.yml).
lang: ko-KR

# ----------------------------------------------------------------------------
# Multilingual (plugin-free) — see _includes/lang-switcher.html
# ----------------------------------------------------------------------------
# Short code (matching each post's `lang:` front matter) for the site's
# primary language. Listings, archives, categories, search and the RSS feed
# show ONLY posts in this language; posts in other languages are reached via
# the in-post language switcher. Posts default to this language (see the
# `defaults` block below), so only translations need an explicit `lang:`.
lang_default: ko

timezone: Asia/Seoul

# ----------------------------------------------------------------------------
# Site identity
# ----------------------------------------------------------------------------
title: ᄎᆞᆷ괴로운 블로그
tagline: ᄎᆞᆷ괴로운 언어학 관련 얘기하는 곳
description: >-
  ᄎᆞᆷ괴로운 언어학 관련 얘기하는 곳

# Production hostname & protocol (matches CNAME). Used for absolute sitemap
# and canonical URLs; `jekyll serve` overrides it for local preview.
url: "https://blog.xn--gt1b.xyz"
baseurl: ""

github:
  username: mujjingun

avatar: /assets/img/avatar.jpg

social:
  name: ᄎᆞᆷ괴
  email: mujjingun@gmail.com
  links:
    - https://github.com/mujjingun

# [light | dark | empty] — empty means follow the system / show a toggle.
theme_mode:

# Table of contents in the right sidebar of posts.
toc: true

comments:
  provider: # [disqus | utterances | giscus]

paginate: 10

# Publish posts with a future date (matches the previous `jekyll build --future`).
future: true

# ----------------------------------------------------------------------------
# The options below are part of Chirpy's expected configuration and are
# generally not modified.
# ----------------------------------------------------------------------------
markdown: kramdown

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1
  smart_quotes: ["apos", "apos", "quot", "quot"]

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      # `translated-post` wraps the theme's `post` layout to add the language
      # switcher; see _layouts/translated-post.html.
      layout: translated-post
      # Default language for posts. Translations override this with `lang: en`.
      lang: ko
      comments: true
      toc: true
      math: true
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

exclude:
  - "*.gem"
  - "*.gemspec"
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json
  - _backup_minima
